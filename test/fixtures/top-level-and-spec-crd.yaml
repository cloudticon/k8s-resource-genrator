# CRD with a spec and an extra root-level field next to it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bundles.example.com
spec:
  group: example.com
  names:
    kind: Bundle
    plural: bundles
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            data:
              type: object
              additionalProperties:
                type: string
            spec:
              type: object
              properties:
                target:
                  type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
