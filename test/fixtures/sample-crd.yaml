apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: certificates.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: Certificate
    listKind: CertificateList
    plural: certificates
    singular: certificate
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - secretName
                - issuerRef
              properties:
                secretName:
                  description: Name of the Secret resource to store the certificate
                  type: string
                issuerRef:
                  description: Reference to the issuer responsible for issuing the certificate
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      enum:
                        - Issuer
                        - ClusterIssuer
                    group:
                      type: string
                duration:
                  description: "Requested certificate validity duration, e.g. 2160h"
                  type: string
                renewBefore:
                  description: "How long before cert expiry to attempt renewal"
                  type: string
                dnsNames:
                  description: DNS names for the certificate
                  type: array
                  items:
                    type: string
                ipAddresses:
                  description: IP addresses for the certificate
                  type: array
                  items:
                    type: string
                isCA:
                  description: Whether the certificate is a CA
                  type: boolean
                usages:
                  description: Key usages
                  type: array
                  items:
                    type: string
                    enum:
                      - signing
                      - digital signature
                      - content commitment
                      - key encipherment
                      - key agreement
                      - data encipherment
                      - cert sign
                      - crl sign
                      - encipher only
                      - decipher only
                      - any
                      - server auth
                      - client auth
                      - code signing
                      - email protection
                      - s/mime
                      - ipsec end system
                      - ipsec tunnel
                      - ipsec user
                      - timestamping
                      - ocsp signing
                      - microsoft sgc
                      - netscape sgc
