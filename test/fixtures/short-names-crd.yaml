apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mycerts.example.com
spec:
  group: example.com
  names:
    kind: MyCert
    plural: mycerts
    singular: mycert
    shortNames:
      - cert
      - certs
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
                issuer:
                  type: string
