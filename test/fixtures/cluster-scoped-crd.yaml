apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterissuers.cert-manager.io
spec:
  group: cert-manager.io
  names:
    kind: ClusterIssuer
    listKind: ClusterIssuerList
    plural: clusterissuers
    singular: clusterissuer
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                acme:
                  type: object
                  required:
                    - server
                    - privateKeySecretRef
                  properties:
                    server:
                      description: URL of the ACME server
                      type: string
                    email:
                      description: Email for ACME registration
                      type: string
                    privateKeySecretRef:
                      type: object
                      required:
                        - name
                      properties:
                        name:
                          type: string
                    solvers:
                      type: array
                      items:
                        type: object
                        properties:
                          http01:
                            type: object
                            properties:
                              ingress:
                                type: object
                                properties:
                                  class:
                                    type: string
                          dns01:
                            type: object
                            properties:
                              cloudflare:
                                type: object
                                properties:
                                  apiTokenSecretRef:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                      key:
                                        type: string
